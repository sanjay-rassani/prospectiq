[project]
name = "prospecting-engine"
version = "0.1.0"
description = "Self-hosted B2B project prospecting engine. No paid dependencies."
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "httpx>=0.27",
    "trafilatura>=2.0",
    "feedparser>=6.0",
    "apscheduler>=3.10,<4.0",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# BLE is enabled deliberately: broad excepts are sometimes right (a health check should
# report a failure rather than 500), but each one should be an explicit, justified noqa.
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "BLE"]

[tool.ruff.lint.flake8-bugbear]
# Depends() in an argument default is the intended FastAPI idiom, not the mutable-default
# bug that B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["trafilatura.*", "feedparser.*", "apscheduler.*", "yaml.*", "playwright.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
