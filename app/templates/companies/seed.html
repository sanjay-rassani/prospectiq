{% extends "base.html" %}
{% set active = 'companies' %}

{% block content %}
<header class="row">
  <div>
    <h1>Seed</h1>
    <p>Paste domains or URLs you already know.</p>
  </div>
  <div>
    <a href="/companies/discover" role="button" class="secondary outline">Discover</a>
  </div>
</header>

{% if error %}
<p><mark>{{ error }}</mark></p>
{% endif %}

<form method="post" action="/companies/seed">
  <label for="blob">
    One per line
    <textarea id="blob" name="blob" rows="10" required
      placeholder="example.com&#10;https://acme.io/about&#10;Northwind | northwind.example">{{ blob }}</textarea>
  </label>
  <button type="submit">Fetch</button>
  <a href="/companies" role="button" class="secondary outline">Cancel</a>
</form>
{% endblock %}
