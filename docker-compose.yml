# Postgres + optional SearXNG. Ollama stays on the host (decision D-03).
services:
  db:
    image: postgres:17-alpine
    container_name: prospectiq-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prospectiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prospectiq}
      POSTGRES_DB: ${POSTGRES_DB:-prospectiq}
    ports:
      # Localhost only. The database must not be reachable from the network
      # (spec section 18, local-first).
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prospectiq} -d ${POSTGRES_DB:-prospectiq}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Self-hosted metasearch for Discover. JSON format enabled in deploy/searxng/settings.yml.
  searxng:
    image: searxng/searxng:latest
    container_name: prospectiq-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8080/
      SEARXNG_LIMITER: "false"

volumes:
  pgdata:
