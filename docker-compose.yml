# Postgres only. Ollama runs as a host systemd service rather than a container so it
# gets direct CPU access, which matters on a machine with no discrete GPU (decision D-03).
services:
  db:
    image: postgres:17-alpine
    container_name: prospectiq-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prospectiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prospectiq}
      POSTGRES_DB: ${POSTGRES_DB:-prospectiq}
    ports:
      # Localhost only. The database must not be reachable from the network
      # (spec section 18, local-first).
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prospectiq} -d ${POSTGRES_DB:-prospectiq}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
